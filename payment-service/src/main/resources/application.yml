
server:
  port: 8084

spring:
  application:
    name: payment-service

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-retries: 2
          multiplier: 2.0
          max-interval: 5s

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

payment:
  retry-test:
    enabled: false
